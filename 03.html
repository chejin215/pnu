<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청소년 스트레스 인지율 데이터 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        .chart-wrapper {
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 2rem;
            background: #ffffff;
        }

        .home-btn {
            transition: all 0.2s ease;
        }
        .home-btn:hover {
            transform: translateY(-1px);
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-6xl mx-auto">
        <!-- 상단 네비게이션 -->
        <div class="mb-8 flex items-center justify-between">
            <button onclick="location.href='https://chejin215.github.io/pnu/index.html'" class="home-btn flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-sm font-semibold text-slate-600">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                홈으로
            </button>
        </div>

        <!-- 제목 섹션 -->
        <div class="mb-12">
            <h1 class="text-2xl font-bold text-slate-800 border-l-4 border-indigo-600 pl-4">청소년 스트레스 인지율 통계 그래프</h1>
        </div>

        <div class="space-y-12">
            <!-- 1. 연도별 추이 그래프 -->
            <div class="chart-wrapper">
                <h3 class="text-lg font-semibold mb-6 text-slate-700">연도별 스트레스 인지율 추이 (2020-2024)</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- 2. 성별 비교 그래프 -->
                <div class="chart-wrapper">
                    <h3 class="text-lg font-semibold mb-6 text-slate-700">성별 스트레스 인지율 추이 비교</h3>
                    <div class="chart-container">
                        <canvas id="genderComparisonChart"></canvas>
                    </div>
                </div>

                <!-- 3. 학교급별 그래프 -->
                <div class="chart-wrapper">
                    <h3 class="text-lg font-semibold mb-6 text-slate-700">학교급별 스트레스 인지율 추이</h3>
                    <div class="chart-container">
                        <canvas id="schoolLevelChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 4. 성별 및 학교급별 통합 분석 그래프 -->
            <div class="chart-wrapper">
                <h3 class="text-lg font-semibold mb-6 text-slate-700">성별 및 학교급별 통합 분석 (전체 꺾은선)</h3>
                <div class="chart-container">
                    <canvas id="combinedChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 공통 옵션 설정
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                    labels: { font: { family: 'Pretendard', size: 13 } }
                }
            },
            scales: {
                y: { beginAtZero: false, min: 25, max: 55 }
            }
        };

        // 1. 연도별 추이 (Line Chart)
        new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['2020', '2021', '2022', '2023', '2024'],
                datasets: [{
                    label: '전체 인지율(%)',
                    data: [37.2, 38.3, 40.1, 39.5, 41.3],
                    borderColor: '#4f46e5',
                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                    borderWidth: 4,
                    pointRadius: 6,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: commonOptions
        });

        // 2. 성별 비교 (Line Chart)
        new Chart(document.getElementById('genderComparisonChart'), {
            type: 'line',
            data: {
                labels: ['2020', '2021', '2022', '2023', '2024'],
                datasets: [
                    {
                        label: '여학생(%)',
                        data: [43.4, 44.5, 46.8, 46.2, 47.8],
                        borderColor: '#ec4899',
                        backgroundColor: '#ec4899',
                        borderWidth: 3,
                        pointRadius: 4,
                        tension: 0.3
                    },
                    {
                        label: '남학생(%)',
                        data: [31.5, 32.8, 34.0, 33.5, 35.2],
                        borderColor: '#3b82f6',
                        backgroundColor: '#3b82f6',
                        borderWidth: 3,
                        pointRadius: 4,
                        tension: 0.3
                    }
                ]
            },
            options: commonOptions
        });

        // 3. 학교급별 비교 (Line Chart)
        new Chart(document.getElementById('schoolLevelChart'), {
            type: 'line',
            data: {
                labels: ['2020', '2021', '2022', '2023', '2024'],
                datasets: [
                    {
                        label: '고등학생(%)',
                        data: [39.8, 41.2, 42.5, 42.0, 43.9],
                        borderColor: '#1e293b',
                        backgroundColor: '#1e293b',
                        borderWidth: 3,
                        pointRadius: 4,
                        tension: 0.3
                    },
                    {
                        label: '중학생(%)',
                        data: [34.5, 35.4, 37.7, 37.0, 38.7],
                        borderColor: '#94a3b8',
                        backgroundColor: '#94a3b8',
                        borderWidth: 3,
                        pointRadius: 4,
                        tension: 0.3
                    }
                ]
            },
            options: commonOptions
        });

        // 4. 성별 + 학교급별 통합 분석 (Multiple Line Chart)
        new Chart(document.getElementById('combinedChart'), {
            type: 'line',
            data: {
                labels: ['2020', '2021', '2022', '2023', '2024'],
                datasets: [
                    {
                        label: '고교 여학생(%)',
                        data: [46.5, 48.0, 50.1, 49.5, 51.2],
                        borderColor: '#db2777',
                        borderWidth: 3,
                        pointStyle: 'rectRot',
                        pointRadius: 5,
                        tension: 0.2
                    },
                    {
                        label: '중등 여학생(%)',
                        data: [40.3, 41.0, 43.5, 42.9, 44.4],
                        borderColor: '#f472b6',
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.2
                    },
                    {
                        label: '고교 남학생(%)',
                        data: [33.1, 34.4, 34.9, 34.5, 36.6],
                        borderColor: '#1d4ed8',
                        borderWidth: 3,
                        pointStyle: 'rectRot',
                        pointRadius: 5,
                        tension: 0.2
                    },
                    {
                        label: '중등 남학생(%)',
                        data: [28.7, 29.8, 31.9, 31.1, 33.0],
                        borderColor: '#60a5fa',
                        borderWidth: 2,
                        pointRadius: 4,
                        tension: 0.2
                    }
                ]
            },
            options: {
                ...commonOptions,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { boxWidth: 12, padding: 15 }
                    }
                }
            }
        });
    </script>
</body>
</html>
