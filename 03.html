<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청소년 스트레스 인지율 데이터 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        .chart-wrapper {
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 2rem;
            background: #ffffff;
        }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-6xl mx-auto">
        <!-- 제목 섹션 -->
        <div class="mb-12">
            <h1 class="text-2xl font-bold text-slate-800 border-l-4 border-indigo-600 pl-4">청소년 스트레스 인지율 통계 그래프</h1>
        </div>

        <div class="space-y-12">
            <!-- 1. 연도별 추이 그래프 -->
            <div class="chart-wrapper">
                <h3 class="text-lg font-semibold mb-6 text-slate-700">연도별 스트레스 인지율 추이 (2020-2024)</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- 2. 성별 비교 그래프 -->
                <div class="chart-wrapper">
                    <h3 class="text-lg font-semibold mb-6 text-slate-700">성별 스트레스 인지율 비교</h3>
                    <div class="chart-container">
                        <canvas id="genderComparisonChart"></canvas>
                    </div>
                </div>

                <!-- 3. 학교급별 그래프 -->
                <div class="chart-wrapper">
                    <h3 class="text-lg font-semibold mb-6 text-slate-700">중·고등학교급별 인지율</h3>
                    <div class="chart-container">
                        <canvas id="schoolLevelChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 4. 성별 및 학교급별 통합 분석 그래프 -->
            <div class="chart-wrapper">
                <h3 class="text-lg font-semibold mb-6 text-slate-700">성별 및 학교급별 통합 분석</h3>
                <div class="chart-container">
                    <canvas id="combinedChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 공통 옵션 설정
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                    labels: { font: { family: 'Pretendard', size: 13 } }
                }
            }
        };

        // 1. 연도별 추이 (Line Chart)
        new Chart(document.getElementById('trendChart'), {
            type: 'line',
            data: {
                labels: ['2020', '2021', '2022', '2023', '2024'],
                datasets: [{
                    label: '전체 인지율(%)',
                    data: [37.2, 38.3, 40.1, 39.5, 41.3],
                    borderColor: '#4f46e5',
                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                    borderWidth: 4,
                    pointRadius: 6,
                    pointBackgroundColor: '#4f46e5',
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                ...commonOptions,
                scales: {
                    y: { beginAtZero: false, min: 30, max: 50 }
                }
            }
        });

        // 2. 성별 비교 (Bar Chart)
        new Chart(document.getElementById('genderComparisonChart'), {
            type: 'bar',
            data: {
                labels: ['남학생', '여학생'],
                datasets: [{
                    label: '인지율(%)',
                    data: [35.2, 47.8],
                    backgroundColor: ['#3b82f6', '#ec4899'],
                    borderRadius: 10,
                    barThickness: 60
                }]
            },
            options: {
                ...commonOptions,
                scales: {
                    y: { beginAtZero: true, max: 60 }
                }
            }
        });

        // 3. 학교급별 비교 (Horizontal Bar Chart)
        new Chart(document.getElementById('schoolLevelChart'), {
            type: 'bar',
            data: {
                labels: ['중학교', '고등학교'],
                datasets: [{
                    label: '인지율(%)',
                    data: [38.7, 43.9],
                    backgroundColor: ['#94a3b8', '#1e293b'],
                    borderRadius: 10,
                    barThickness: 60
                }]
            },
            options: {
                ...commonOptions,
                indexAxis: 'y',
                scales: {
                    x: { beginAtZero: true, max: 60 }
                }
            }
        });

        // 4. 성별 + 학교급별 통합 분석 (Grouped Bar Chart)
        new Chart(document.getElementById('combinedChart'), {
            type: 'bar',
            data: {
                labels: ['중학교', '고등학교'],
                datasets: [
                    {
                        label: '남학생(%)',
                        data: [32.4, 38.0],
                        backgroundColor: '#3b82f6',
                        borderRadius: 8
                    },
                    {
                        label: '여학생(%)',
                        data: [45.0, 50.6],
                        backgroundColor: '#ec4899',
                        borderRadius: 8
                    }
                ]
            },
            options: {
                ...commonOptions,
                scales: {
                    y: { beginAtZero: true, max: 60 }
                }
            }
        });
    </script>
</body>
</html>
